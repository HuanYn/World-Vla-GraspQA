[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "world-vla-graspqa"
version = "0.1.0"
description = "World-model-based robotic grasping QA and closed-loop manipulation system."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]
[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
