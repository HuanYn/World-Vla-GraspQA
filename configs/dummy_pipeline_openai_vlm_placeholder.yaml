project:
  name: World-VLA-GraspQA
  stage: openai_vlm_placeholder
scene:
  image_path: data/raw/sample_scenes/tabletop_dummy_scene.png
  instruction: Pick up the red cube and place it into the blue bowl.
  annotation_path: data/annotations/sample_scenes/tabletop_dummy_scene.json
perception:
  mode: dummy
  objects:
  - name: red cube
    color: red
    shape: cube
    graspable: true
  - name: blue bowl
    color: blue
    shape: bowl
    graspable: false
  - name: yellow banana
    color: yellow
    shape: banana
    graspable: true
graspqa:
  question: Which object should the robot grasp?
  mode: vlm
  vlm:
    provider: openai
    model_name: gpt-4o-mini
    enabled: false
planner:
  strategy: max_success_probability
world_model:
  mode: empirical
  dataset_path: data/action_outcomes/dummy_action_outcomes.json
  default_success: 0.5
